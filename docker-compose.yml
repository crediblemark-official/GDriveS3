services:
  gdrives3:
    build: .
    container_name: gdrives3
    restart: unless-stopped
    ports:
      - "8787:8787" # Admin Web Panel & REST API
      - "9000:9000" # AWS S3-compatible API
    env_file:
      - .env
    environment:
      - GDRIVES3_DATA_DIR=/var/lib/gdrives3-data
      - NODE_ENV=production
    volumes:
      - gdrives3_data:/var/lib/gdrives3-data

volumes:
  gdrives3_data:
    driver: local
